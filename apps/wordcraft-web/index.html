<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content">
  <title>WordCraft</title>
  <link data-trunk rel="icon" href="../../assets/app-icon/wordcraft.ico" />
  <link data-trunk rel="copy-dir" href="fonts" />
  <link data-trunk rel="copy-file" href="../wordcraft-android/node_modules/@capacitor/core/dist/capacitor.js" data-target-path="capacitor/capacitor.js" />
  <link data-trunk rel="copy-file" href="../wordcraft-android/node_modules/@capacitor/preferences/dist/plugin.js" data-target-path="capacitor/preferences.js" />
  <link data-trunk rel="copy-file" href="../wordcraft-android/node_modules/@capacitor/filesystem/dist/plugin.js" data-target-path="capacitor/filesystem.js" />
  <link data-trunk rel="copy-file" href="../wordcraft-android/node_modules/@capacitor/share/dist/plugin.js" data-target-path="capacitor/share.js" />
  <script src="./capacitor/capacitor.js"></script>
  <script src="./capacitor/preferences.js"></script>
  <script src="./capacitor/filesystem.js"></script>
  <script src="./capacitor/share.js"></script>
  <link data-trunk rel="rust" data-bin="wordcraft-web" data-wasm-opt="z" data-weak-refs />
  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; height: 100dvh; overflow: hidden; background: #e6e6e6; }
    #wordcraft_canvas {
      position: absolute;
      inset: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px);
      width: calc(100% - env(safe-area-inset-left, 0px) - env(safe-area-inset-right, 0px));
      height: calc(100dvh - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px));
      display: block;
      touch-action: none;
    }
    #wordcraft_loading { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
      color: #555; font: 14px system-ui, sans-serif; pointer-events: none; }
  </style>
</head>
<body>
  <canvas id="wordcraft_canvas"></canvas>
  <div id="wordcraft_loading">Loading WordCraft&hellip;</div>
</body>
</html>
